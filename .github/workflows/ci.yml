name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Type-check + tests ────────────────────────────────────────────────────────
  # Runs on every push and every PR. Deployment is blocked until this passes.
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/worker/package-lock.json

      # ── Frontend ──
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      # ── Worker ──
      - name: Install worker dependencies
        run: npm ci
        working-directory: backend/worker

      - name: Test worker
        run: npm test
        working-directory: backend/worker

  # ── Deploy Worker ─────────────────────────────────────────────────────────────
  # Only runs on push to main (not on PRs) and only after tests pass.
  # Requires CLOUDFLARE_API_TOKEN to be added as a GitHub repository secret.
  # Frontend is deployed automatically by Vercel's GitHub integration.
  deploy-worker:
    name: Deploy Worker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install worker dependencies
        run: npm ci
        working-directory: backend/worker

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
